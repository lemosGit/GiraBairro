# Gerado por scripts/gerar_openapi.py — editar o script, não este ficheiro.
openapi: 3.0.3
info:
  title: GiraBairro API
  version: 0.1.0
  description: 'Contrato da API do GiraBairro (M3-05). Consumido pela web (Next.js) e pela app (React Native).


    - Autenticação: `Authorization: Bearer <access_token>` (ADR-006).

    - Datas em ISO 8601 UTC; a interface mostra em `Africa/Luanda` (RNF-034).

    - Erros no formato `Erro`.

    - Operações de escrita sobre uma equipa/jogo exigem ser responsável dessa equipa / participante do jogo (RN-13) → 403.

    - Rotas `/admin/*` exigem papel `admin`.'
servers:
- url: http://localhost:8000/v1
  description: Desenvolvimento
- url: https://api.staging.girabairro.example/v1
  description: Staging (domínio a definir — M3-07)
tags:
- name: auth
  description: Conta e sessão — RF-01
- name: utilizadores
  description: Perfil — RF-01.06
- name: localizacao
  description: Províncias, municípios, bairros
- name: equipas
  description: Equipas — RF-02
- name: jogadores
  description: Plantel — RF-03
- name: contactos
  description: Contactos — RF-04
- name: solicitacoes
  description: Solicitações de jogo — RF-05
- name: jogos
  description: Jogos — RF-05/06
- name: comparencias
  description: Comparência — RF-07
- name: resultados
  description: Resultados e divergências — RF-06/08
- name: ranking
  description: Ranking e estrelas — RF-09
- name: notificacoes
  description: Notificações — RF-10
- name: dashboard
  description: Dashboard — TEL-05
- name: admin
  description: Administração — RF-11 (papel admin)
security:
- bearer: []
paths:
  /auth/registo:
    post:
      tags:
      - auth
      summary: Criar conta
      description: '**Requisitos:** RF-01.01–03, UC01


        409 se o telefone já existe (RF-01.03).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistoIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/sessoes:
    post:
      tags:
      - auth
      summary: Iniciar sessão
      description: '**Requisitos:** RF-01.04, UC02, RNF-021'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '423':
          $ref: '#/components/responses/E423'
        '429':
          $ref: '#/components/responses/E429'
      security: []
    delete:
      tags:
      - auth
      summary: Terminar sessão (revoga o refresh token)
      description: '**Requisitos:** RF-01.05'
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
  /auth/sessoes/renovar:
    post:
      tags:
      - auth
      summary: Renovar tokens (refresh rotativo)
      description: '**Requisitos:** ADR-006'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPar'
        '401':
          $ref: '#/components/responses/E401'
      security: []
  /auth/recuperacao:
    post:
      tags:
      - auth
      summary: Pedir código de recuperação por SMS
      description: '**Requisitos:** RF-01.07, UC03


        Responde sempre 202, exista ou não a conta (não revela contas).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telefone:
                  $ref: '#/components/schemas/Telefone'
              required:
              - telefone
      responses:
        '202':
          description: Sem conteúdo
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /auth/recuperacao/confirmar:
    post:
      tags:
      - auth
      summary: Confirmar código e definir nova palavra-passe
      description: '**Requisitos:** RF-01.07, RNF-025'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                telefone:
                  $ref: '#/components/schemas/Telefone'
                codigo:
                  type: string
                  maxLength: 6
                  pattern: ^[0-9]{6}$
                nova_palavra_passe:
                  $ref: '#/components/schemas/PalavraPasse'
              required:
              - telefone
              - codigo
              - nova_palavra_passe
      responses:
        '204':
          description: Sem conteúdo
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
      security: []
  /me:
    get:
      tags:
      - utilizadores
      summary: Dados do utilizador actual
      description: '**Requisitos:** RF-01.06, TEL-21'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/E401'
    patch:
      tags:
      - utilizadores
      summary: Editar dados básicos
      description: '**Requisitos:** RF-01.06'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtilizadorPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
  /me/palavra-passe:
    post:
      tags:
      - utilizadores
      summary: Alterar palavra-passe
      description: '**Requisitos:** TEL-21'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actual:
                  $ref: '#/components/schemas/PalavraPasse'
                nova:
                  $ref: '#/components/schemas/PalavraPasse'
              required:
              - actual
              - nova
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '422':
          $ref: '#/components/responses/E422'
  /provincias:
    get:
      tags:
      - localizacao
      summary: Listar províncias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Local'
      security: []
  /provincias/{provincia_id}/municipios:
    get:
      tags:
      - localizacao
      summary: Municípios de uma província
      parameters:
      - name: provincia_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Local'
      security: []
  /municipios/{municipio_id}/bairros:
    get:
      tags:
      - localizacao
      summary: Bairros de um município
      parameters:
      - name: municipio_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Local'
      security: []
  /equipas:
    get:
      tags:
      - equipas
      summary: Pesquisar equipas
      description: '**Requisitos:** RF-02.08, RF-05.01–02, TEL-10'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: Nome (parcial)
      - name: provincia_id
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: municipio_id
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: bairro_id
        in: query
        required: false
        schema:
          type: integer
        description: ''
      - name: disponiveis
        in: query
        required: false
        schema: &id007
          type: boolean
        description: Só equipas activas
      - &id002
        name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: ''
      - &id003
        name: tamanho
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
        description: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEquipaResumo'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - {}
      - bearer: []
    post:
      tags:
      - equipas
      summary: Registar equipa
      description: '**Requisitos:** RF-02.01–03, RF-02.09, RN-18, UC04


        409 se o utilizador já administra uma equipa (RN-18) ou duplicado nome+bairro (RF-02.09).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipaIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipaPerfil'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /equipas/{equipa_id}:
    get:
      tags:
      - equipas
      summary: Perfil público da equipa
      description: '**Requisitos:** RF-02.07, RF-04.05, RN-17, RN-22, TEL-11'
      parameters:
      - &id001
        name: equipa_id
        in: path
        required: true
        schema: &id004
          type: string
          format: uuid
        description: Equipa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipaPerfil'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - {}
      - bearer: []
    patch:
      tags:
      - equipas
      summary: Editar equipa
      description: '**Requisitos:** RF-02.06, RN-02'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipaPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipaPerfil'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /equipas/{equipa_id}/emblema:
    put:
      tags:
      - equipas
      summary: Carregar emblema
      description: '**Requisitos:** RF-02.04, RNF-003


        JPG/PNG/WebP até 2 MB.'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                ficheiro:
                  type: string
                  format: binary
              required:
              - ficheiro
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  emblema_url:
                    type: string
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
  /equipas/{equipa_id}/jogos:
    get:
      tags:
      - equipas
      summary: Histórico de jogos da equipa
      description: '**Requisitos:** RF-06.12, RF-07.08'
      parameters:
      - *id001
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaJogo'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - {}
      - bearer: []
  /equipas/{equipa_id}/jogadores:
    get:
      tags:
      - jogadores
      summary: Listar jogadores (inclui inactivos)
      description: '**Requisitos:** RF-03.05, TEL-07'
      parameters:
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Jogador'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
    post:
      tags:
      - jogadores
      summary: Adicionar jogador
      description: '**Requisitos:** RF-03.01–02, RN-04


        409 se o número já está em uso (RN-04).'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogadorIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jogador'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /equipas/{equipa_id}/jogadores/{jogador_id}:
    patch:
      tags:
      - jogadores
      summary: Editar / activar / desactivar jogador
      description: '**Requisitos:** RF-03.03–04'
      parameters:
      - *id001
      - name: jogador_id
        in: path
        required: true
        schema: *id004
        description: Jogador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JogadorIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jogador'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
    delete:
      tags:
      - jogadores
      summary: Remover jogador
      description: '**Requisitos:** RF-03.04'
      parameters:
      - *id001
      - name: jogador_id
        in: path
        required: true
        schema: *id004
        description: Jogador
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /equipas/{equipa_id}/contactos:
    get:
      tags:
      - contactos
      summary: Listar contactos
      description: '**Requisitos:** RF-04, TEL-09'
      parameters:
      - *id001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contacto'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
    post:
      tags:
      - contactos
      summary: Adicionar contacto
      description: '**Requisitos:** RF-04.01–03'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacto'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
  /equipas/{equipa_id}/contactos/{contacto_id}:
    patch:
      tags:
      - contactos
      summary: Editar contacto / definir principal
      description: '**Requisitos:** RF-04.03–04'
      parameters:
      - *id001
      - name: contacto_id
        in: path
        required: true
        schema: *id004
        description: Contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactoIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contacto'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
    delete:
      tags:
      - contactos
      summary: Remover contacto
      description: '**Requisitos:** RF-04.04


        409 se for o último contacto principal.'
      parameters:
      - *id001
      - name: contacto_id
        in: path
        required: true
        schema: *id004
        description: Contacto
      responses:
        '204':
          description: Sem conteúdo
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /solicitacoes:
    get:
      tags:
      - solicitacoes
      summary: Listar solicitações da minha equipa
      description: '**Requisitos:** TEL-13'
      parameters:
      - name: tipo
        in: query
        required: false
        schema:
          type: string
          enum:
          - recebidas
          - enviadas
        description: ''
      - name: estado
        in: query
        required: false
        schema:
          type: string
          enum: &id013
          - pendente
          - alteracao_proposta
          - aceite
          - recusada
          - cancelada
        description: ''
      - *id002
      - *id003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaSolicitacao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
    post:
      tags:
      - solicitacoes
      summary: Solicitar jogo
      description: '**Requisitos:** RF-05.03–04, RN-19, UC08'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitacaoIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitacao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
        '429':
          $ref: '#/components/responses/E429'
  /solicitacoes/{solicitacao_id}:
    get:
      tags:
      - solicitacoes
      summary: Detalhe da solicitação
      parameters:
      - &id005
        name: solicitacao_id
        in: path
        required: true
        schema: *id004
        description: Solicitação
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitacao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
  /solicitacoes/{solicitacao_id}/aceitar:
    post:
      tags:
      - solicitacoes
      summary: Aceitar (cria o jogo)
      description: '**Requisitos:** RF-05.05, RF-05.08, RN-05, UC09'
      parameters:
      - *id005
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jogo'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /solicitacoes/{solicitacao_id}/recusar:
    post:
      tags:
      - solicitacoes
      summary: Recusar
      description: '**Requisitos:** RF-05.05'
      parameters:
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotivoOpcionalIn'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitacao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /solicitacoes/{solicitacao_id}/propostas:
    post:
      tags:
      - solicitacoes
      summary: Propor alteração de data/hora/local
      description: '**Requisitos:** RF-05.06'
      parameters:
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropostaIn'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Solicitacao'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /solicitacoes/{solicitacao_id}/cancelar:
    post:
      tags:
      - solicitacoes
      summary: Cancelar solicitação
      description: '**Requisitos:** RF-05.09, UC10'
      parameters:
      - *id005
      requestBody:
        required: true
        content:
