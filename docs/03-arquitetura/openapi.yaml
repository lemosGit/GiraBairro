components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    E400:
      description: Pedido mal formado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E401:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E403:
      description: Proibido (RN-13, suspensão ou papel)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E404:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E409:
      description: 'Conflito de estado (ex.: janela fechada, já respondida)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E422:
      description: Validação ou regra de negócio violada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E423:
      description: Conta bloqueada temporariamente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    E429:
      description: Demasiados pedidos (RNF-027)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        codigo:
          type: string
          example: regra_negocio_violada
        mensagem:
          type: string
          example: Número já em uso
        detalhes:
          type: object
          additionalProperties: true
      required:
      - codigo
      - mensagem
      description: Corpo padrão de erro (padrao-backend.md §4)
    Telefone:
      type: string
      maxLength: 20
      pattern: ^\+?[0-9]{9,15}$
      example: '+244923000000'
    PalavraPasse:
      type: string
      maxLength: 128
      minLength: 8
      format: password
    TokenPar:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expira_em: &id012
          type: string
          format: date-time
        tipo:
          type: string
          example: Bearer
      required:
      - access_token
      - refresh_token
      - expira_em
    RegistoIn:
      type: object
      properties:
        nome_completo:
          type: string
          maxLength: 120
        telefone:
          $ref: '#/components/schemas/Telefone'
        palavra_passe:
          $ref: '#/components/schemas/PalavraPasse'
        aceita_termos:
          type: boolean
          enum:
          - true
      required:
      - nome_completo
      - telefone
      - palavra_passe
      - aceita_termos
    LoginIn:
      type: object
      properties:
        telefone:
          $ref: '#/components/schemas/Telefone'
        palavra_passe:
          $ref: '#/components/schemas/PalavraPasse'
        cliente:
          type: string
          enum:
          - web
          - mobile
      required:
      - telefone
      - palavra_passe
      - cliente
    Sessao:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPar'
        utilizador:
          $ref: '#/components/schemas/Utilizador'
      required:
      - tokens
      - utilizador
    Utilizador:
      type: object
      properties:
        id: *id004
        nome_completo:
          type: string
        telefone:
          $ref: '#/components/schemas/Telefone'
        papel:
          type: string
          enum:
          - utilizador
          - admin
        estado:
          type: string
          enum: *id008
        equipa_id:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - nome_completo
      - telefone
      - papel
      - estado
    UtilizadorPatch:
      type: object
      properties:
        nome_completo:
          type: string
          maxLength: 120
    Local:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
      required:
      - id
      - nome
    Localizacao:
      type: object
      properties:
        bairro:
          $ref: '#/components/schemas/Local'
        municipio:
          $ref: '#/components/schemas/Local'
        provincia:
          $ref: '#/components/schemas/Local'
      required:
      - bairro
      - municipio
      - provincia
